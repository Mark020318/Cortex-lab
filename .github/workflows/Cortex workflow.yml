name: Cortex CLI Code Scan (Changed Files Only)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  CORTEX_API_URL: ${{ secrets.CORTEX_API_BASE_URL }}
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY_SECRET }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}

jobs:
  cortex-code-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0          # git diff 需要歷史

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Verify Node.js Version
      run: node -v

    - name: Collect changed files
      id: changes
      run: |
        set -e
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
        else
          BASE="${{ github.event.before }}"
        fi
        # 新分支 / force push 時 BASE 不存在，退回比上一個 commit
        git cat-file -e "${BASE}^{commit}" 2>/dev/null || \
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)

        git diff --name-only --diff-filter=ACM "$BASE" HEAD > changed.txt
        echo "=== Changed files ==="
        cat changed.txt

        mkdir -p _cortex_scan
        while IFS= read -r f; do
          [ -f "$f" ] || continue
          mkdir -p "_cortex_scan/$(dirname "$f")"
          cp "$f" "_cortex_scan/$f"
        done < changed.txt

        echo "count=$(find _cortex_scan -type f | wc -l)" >> "$GITHUB_OUTPUT"

    - name: Download cortexcli
      if: steps.changes.outputs.count != '0'
      run: |
        set -e
        crtx_resp=$(curl -sS "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
          -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
          -H "Authorization: ${CORTEX_API_KEY}")
        crtx_url=$(echo "$crtx_resp" | jq -r ".signed_url")
        curl -sS -o cortexcli "$crtx_url"
        chmod +x cortexcli
        ./cortexcli --version

    - name: Run Cortex CLI Code Scan
      if: steps.changes.outputs.count != '0'
      run: |
        ./cortexcli \
          --api-base-url "${CORTEX_API_URL}" \
          --api-key "${CORTEX_API_KEY}" \
          --api-key-id "${CORTEX_API_KEY_ID}" \
          code scan \
          --directory "${{ github.workspace }}/_cortex_scan" \
          --repo-id "${{ github.repository }}" \
          --branch "${{ github.head_ref || github.ref_name }}" \
          --source "GITHUB_ACTIONS" \
          --create-repo-if-missing \
          --output sarif \
          --output-file-path "${{ github.workspace }}/scan.sarif"

    - name: Fix SARIF paths
      if: steps.changes.outputs.count != '0'
      run: |
        python3 - <<'PY'
        import json, re
        def fix(o):
            if isinstance(o, dict):
                o.pop("originalUriBaseIds", None)
                return {k: fix(v) for k, v in o.items()}
            if isinstance(o, list):
                return [fix(v) for v in o]
            if isinstance(o, str):
                return re.sub(r"^.*_cortex_scan/", "", o)
            return o
        json.dump(fix(json.load(open("scan.sarif"))), open("result.sarif", "w"))
        PY

    - name: Upload SARIF to GitHub Security
      if: steps.changes.outputs.count != '0'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: result.sarif
        category: cortex-appsec
