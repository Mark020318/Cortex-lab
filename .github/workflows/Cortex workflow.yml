name: Cortex CLI Code Scan (Incremental on PR / Full on main)

on:
  push:
    branches:
      - main          # 只有預設分支做「全量掃描 + 上傳 SARIF」
  pull_request:       # PR 做「增量掃描」，不上傳 SARIF（避免告警被誤判為已修復）
  workflow_dispatch:
    inputs:
      debug:
        description: '開啟 CLI DEBUG log'
        type: boolean
        default: false

env:
  CORTEX_API_URL: https://api-zot-xsiam-nfr.xdr.us.paloaltonetworks.com
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY_SECRET }}   

# 同一分支重複 push 時取消舊的 run，省 runner 時間
concurrency:
  group: cortex-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex-code-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      actions: read            # private repo 上傳 SARIF 需要
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6        # v5 起才是 node24 原生（v4 會噴 Node.js 20 deprecated 警告）
        with:
          fetch-depth: 0                 # git diff 需要完整歷史

      # ── 官方新版新增的關鍵步驟：CLI 的 AppSec 引擎需要 Node.js 22 ──
      - name: Set up Node.js
        uses: actions/setup-node@v6      # v6 起才是 node24 原生
        with:
          node-version: 22               # 這是「要裝給 cortexcli 用的 Node」，跟 action 自己跑在哪個 Node 無關

      - name: Verify Node.js Version
        run: node -v

      # ── 決定這次是增量還是全量 ──
      - name: Decide scan mode
        id: mode
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "incremental=true" >> "$GITHUB_OUTPUT"
          else
            echo "incremental=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 只在 PR 時收集變更檔案（用 git diff，不需要 curl + jq 打 API）──
      - name: Collect changed files
        id: changes
        if: steps.mode.outputs.incremental == 'true'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          # ACMR = Added / Copied / Modified / Renamed，排除已刪除的檔案
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | sort -u > changed_files.txt

          echo "=== Changed Files ==="
          cat changed_files.txt
          echo "count=$(wc -l < changed_files.txt)" >> "$GITHUB_OUTPUT"

      - name: Prepare scan directory
        if: steps.mode.outputs.incremental == 'true' && steps.changes.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p _cortex_changed
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "_cortex_changed/$(dirname "$file")"
            cp "$file" "_cortex_changed/$file"
          done < changed_files.txt

          # 一併帶上相依性清單，SCA / 套件掃描才不會因為缺 lock file 失效
          for manifest in package.json package-lock.json yarn.lock pnpm-lock.yaml \
                          requirements.txt Pipfile.lock poetry.lock \
                          go.mod go.sum pom.xml build.gradle Gemfile.lock composer.lock; do
            [ -f "$manifest" ] && cp "$manifest" "_cortex_changed/" || true
          done

          echo "Files prepared: $(find _cortex_changed -type f | wc -l)"

      - name: Download cortexcli
        run: |
          set -eu   # 不要用 -x，避免把 header 內容印進 log
          crtx_resp=$(curl -sS --fail \
            "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")

          crtx_url=$(echo "$crtx_resp" | jq -r ".signed_url")
          if [ -z "$crtx_url" ] || [ "$crtx_url" = "null" ]; then
            echo "Error: Failed to get signed URL"
            exit 1
          fi

          curl -sS --fail -o cortexcli "$crtx_url"
          chmod +x cortexcli
          ./cortexcli --version    # 官方新版有加，方便對版本

      - name: Run Cortex CLI Code Scan
        # PR 沒有任何變更檔（例如只刪檔）就直接跳過，不要送空掃描
        if: steps.mode.outputs.incremental == 'false' || steps.changes.outputs.count != '0'
        run: |
          set -eu
          if [ "${{ steps.mode.outputs.incremental }}" = "true" ]; then
            SCAN_DIR="${{ github.workspace }}/_cortex_changed"
          else
            SCAN_DIR="${{ github.workspace }}"
          fi

          LOG_ARGS=""
          if [ "${{ inputs.debug }}" = "true" ]; then
            LOG_ARGS="--log-level DEBUG"
          fi

          ./cortexcli \
            $LOG_ARGS \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            code scan \
            --directory "$SCAN_DIR" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --source "GITHUB_ACTIONS" \
            --create-repo-if-missing \
            --upload-mode upload \
            --output sarif \
            --output-file-path "${{ github.workspace }}/result.sarif"

          test -f "${{ github.workspace }}/result.sarif"

      # ── 增量掃描時 SARIF 路徑會變成 _cortex_changed/xxx，要還原成真實路徑 ──
      - name: Normalize SARIF paths
        if: steps.mode.outputs.incremental == 'true' && hashFiles('result.sarif') != ''
        run: |
          set -eu
          jq '(.. | objects | select(has("uri")) | .uri) |=
                (sub("^_cortex_changed/"; "") | sub("^.*/_cortex_changed/"; ""))' \
            result.sarif > result.normalized.sarif
          mv result.normalized.sarif result.sarif

      - name: Upload SARIF artifact
        if: always() && hashFiles('result.sarif') != ''
        uses: actions/upload-artifact@v6   # 注意：v5 只有「預備支援」，預設仍跑 node20，要 v6 起才乾淨
        with:
          name: cortex-sarif-${{ github.run_id }}
          path: result.sarif
          retention-days: 14

      # ── 只有全量掃描才上傳到 Code Scanning，否則會把沒掃到的檔案的告警標成 fixed ──
      - name: Upload SARIF to GitHub Security
        if: steps.mode.outputs.incremental == 'false' && hashFiles('result.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: result.sarif
          category: cortex-appsec
